# Local Supabase development settings (`npx supabase start`). Not used by the hosted project:
# configure the same options in the dashboard (see README). Written by hand and not yet run
# against the CLI, so run `npx supabase --help` and `supabase start` once to confirm it loads.
project_id = "medyra"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your Medyra email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Medyra password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "5MiB"
